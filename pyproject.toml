[project]
name="btclib_libsecp256k1"
version="0.7.1"
description="Simple python bindings to libsecp256k1"
readme = "README.md"
# PEP 639: a SPDX expression and the files it refers to, replacing the
# deprecated license table and the License :: classifier
license = "MIT"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.9"
authors = [
    {name = "Giacomo Caironi", email = "giacomo.caironi@gmail.com"},
]
keywords=["bitcoin", "libsecp256k1"]
classifiers=[
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: Implementation :: CPython",
        "Programming Language :: Python :: Implementation :: PyPy",
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Intended Audience :: Education",
        "Natural Language :: English",
        "Operating System :: OS Independent",
        "Topic :: Security :: Cryptography",
        "Topic :: Scientific/Engineering",
        "Topic :: Software Development :: Libraries :: Python Modules",
    ]
dependencies = ['cffi>=1.0.0']

[project.urls]
homepage = "https://btclib.org"
# btclib.readthedocs.io documents btclib, not these bindings: the README
# is their documentation
documentation = "https://github.com/btclib-org/btclib_libsecp256k1/blob/master/README.md"
repository = "https://github.com/btclib-org/btclib_libsecp256k1"
download = "https://github.com/btclib-org/btclib_libsecp256k1/releases"
changelog = "https://github.com/btclib-org/btclib_libsecp256k1/blob/master/HISTORY.md"
issues = "https://github.com/btclib-org/btclib_libsecp256k1/issues"
pull_requests = "https://github.com/btclib-org/btclib_libsecp256k1/pulls"

[build-system]
# cmake builds the vendored library: it is a build requirement, not a
# system one, so that installing the sdist needs no package manager
# step (a C toolchain is still required, and cannot be provisioned this
# way); a system cmake >= 3.22 works just as well, with
# --no-build-isolation
requires = [
    "hatchling",
    "cffi>=1.0.0",
    'setuptools; python_version>="3.12"',
    "cmake>=3.22",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"
cffi_modules = ["scripts/cffi_build.py:ffi_ext"]

[tool.hatch.build.targets.sdist]
# ship pristine vendored sources only: build artifacts from a local build
# would be stale (or plain wrong) on the machine installing the sdist.
# The CMake build writes nothing inside the vendored tree, so most of
# what follows can only be left over in a tree that predates it
exclude = [
    "/build",
    "/dist",
    "/wheelhouse",
    "_btclib_libsecp256k1.*",
    "**/.libs",
    "**/.deps",
    "**/*.o",
    "**/*.lo",
    "**/*.la",
    "**/*~",
    "secp256k1/src/btclib_default_callbacks.c",
    "secp256k1/autom4te.cache",
    "secp256k1/aclocal.m4",
    "secp256k1/configure",
    "secp256k1/Makefile",
    "secp256k1/Makefile.in",
    "secp256k1/config.log",
    "secp256k1/config.status",
    "secp256k1/libtool",
    "secp256k1/libsecp256k1.pc",
    "secp256k1/build-aux/ar-lib",
    "secp256k1/build-aux/compile",
    "secp256k1/build-aux/config.guess",
    "secp256k1/build-aux/config.sub",
    "secp256k1/build-aux/depcomp",
    "secp256k1/build-aux/install-sh",
    "secp256k1/build-aux/ltmain.sh",
    "secp256k1/build-aux/missing",
    "secp256k1/build-aux/test-driver",
    "secp256k1/build-aux/m4/libtool.m4",
    "secp256k1/build-aux/m4/ltoptions.m4",
    "secp256k1/build-aux/m4/ltsugar.m4",
    "secp256k1/build-aux/m4/ltversion.m4",
    "secp256k1/build-aux/m4/lt~obsolete.m4",
]

[tool.check-wheel-contents]
# a dynamic (cffi ABI mode) wheel ships the shared libsecp256k1 next to
# the package, and __init__.py dlopen()s it from there: a non-module at
# the top level (W003), and therefore a second top-level entry (W009),
# are exactly what that wheel is supposed to contain
ignore = ["W003", "W009"]

# PEP 735 groups, resolved by uv (or by pip --group): they replace the
# hatch environments, which duplicated what nox and pre-commit already
# did. The authoritative versions of the linters remain the revisions
# pinned in .pre-commit-config.yaml, which is the gate; the ones here
# are for editor integration and ad hoc runs
[dependency-groups]
test = ["pytest", "pytest-cov"]
# the mypy hook of .pre-commit-config.yaml declares what the checked
# files import, because it runs in its own isolated environment; running
# mypy from this environment has to find the same things, or it reports
# errors the gate does not (and passes what the gate would reject)
lint = ["pre-commit", "ruff", "mypy", "types-cffi", "hatchling"]
build = ["build", "cibuildwheel"]
# what scripts/benchmark.py times these bindings against, deliberately
# left out of dev: btclib depends on this package, so it cannot be a
# dependency of developing it. Here it is harmless, the lock resolving
# its own btclib_libsecp256k1 requirement to the editable build of this
# very tree rather than to a second copy from PyPI. coincurve and
# secp256k1 compile a libsecp256k1 of their own, so building this group
# needs pkg-config besides the toolchain the README lists
bench = ["btclib", "coincurve", "secp256k1"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
]

[tool.mypy]
# the package ships py.typed: its annotations are what btclib downstream
# type-checks against, so a wrong one propagates
strict = true
show_column_numbers = true
show_error_codes = true
# stubs/_btclib_libsecp256k1.pyi describes the cffi boundary; without it
# ffi and lib are Any and every wrapper checks out vacuously
mypy_path = "stubs"
exclude = [
    "^build/",
    "^secp256k1/",
]

[[tool.mypy.overrides]]
# comparands of the benchmark script, not dependencies of the project:
# btclib in particular must not become one, as it is btclib that depends
# on these bindings. secp256k1 also has to be skipped explicitly, or the
# vendored C tree is picked up as a namespace package of the same name
module = ["btclib.*", "coincurve", "secp256k1"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
# the vendored upstream sources are not ours to lint or reformat
extend-exclude = ["secp256k1"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "D",     # pydocstyle
    "PL",    # pylint
    "RUF",   # ruff-specific
]
ignore = [
    # the blank line between a docstring and the body is the established
    # style of this codebase
    "D202",
    # comparing against a key, signature or hash length (32, 33, 64, 65)
    # is not a magic value: it is the domain
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# the formatter owns the code width (88 columns); E501 only guards
# against the runaway comments and URLs it cannot wrap
max-line-length = 130

[tool.ruff.lint.mccabe]
# see https://en.wikipedia.org/wiki/Cyclomatic_complexity
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# the package namespace is assembled by re-export
"btclib_libsecp256k1/__init__.py" = ["F401"]
# asserts are the point of a test suite, and a test function documents
# itself through its name
"tests/*" = ["S101", "D103"]
# the benchmark script asserts its own results before timing them
"scripts/benchmark.py" = ["S101"]
# the build scripts drive autotools/make and load the cffi build
# description by exec(): both are inherent to compiling a C dependency
# from a build backend, and neither ever sees untrusted input
"scripts/cffi_build.py" = ["S404", "S603", "S607"]
"scripts/hatch_build.py" = ["S102"]
# the build scripts are not part of the documented API
"scripts/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# belt and braces: testpaths is ignored when pytest is given explicit
# paths, and the vendored tree carries python files of its own
norecursedirs = ["secp256k1"]
addopts = "-ra --strict-markers --strict-config"
# an unknown warning is a deprecation the 3.9 to 3.14 spread will turn
# into a breakage, so make it fail while it is still cheap
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["btclib_libsecp256k1"]
# the interesting misses are the guard clauses of a wrapper: statement
# coverage alone would call a half-tested if fully covered
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# the two exceptions the bindings raise are not equally reachable, and
# counting them together made the ratchet meaningless: a ValueError
# reports an argument out of the domain, and every one of them is
# exercised, while a RuntimeError reports a libsecp256k1 call failing
# where no input can make it fail, and none of them can be. Excluding
# the latter leaves a number that only untested code can lower
exclude_also = ["raise RuntimeError"]
# with those excluded the suite reaches every line and every branch, so
# the ratchet can be the only value that fails on a single new untested
# one. It assumes the static extension the coverage job builds: on a
# dynamic one the linked-in branch of _load_lib is the unexecuted one
fail_under = 100

[tool.cibuildwheel]
test-requires = ["pytest"]
test-command = "pytest {project}/tests/"
build-frontend = "build"
archs = "auto64"
# PyPy wheels are opt-in since cibuildwheel 3.0
enable = ["pypy"]
# no static PyPy wheels on Windows, by design: PyPy is best served by
# the ABI-mode dynamic wheel (py3-none-win_amd64), the cffi mode
# recommended on PyPy, which pip falls back to; a static pp3 wheel
# would take precedence over it and perform worse
# cp39 and cp310 have no Windows arm64 build: cibuildwheel lists those
# identifiers (it used to cross-compile them from an x86_64 host) but on
# the native arm64 runner there is no interpreter to build them with
skip = "pp*-win* cp39-win_arm64 cp310-win_arm64"
