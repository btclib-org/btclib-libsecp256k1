---
# three of the four things this repository tracks. The pre-commit hook
# revisions are the one left out, dependabot having no pre-commit
# ecosystem: pre-commit.ci opens that pull request instead, weekly, as
# configured in .pre-commit-config.yaml
#
# every pull request here runs the whole build and test matrix, tens of
# jobs compiling libsecp256k1 from source, so each ecosystem groups its
# updates into a single pull request and asks monthly rather than weekly:
# nothing any of them tracks is security-critical, and the cost of asking
# is measured in machine hours. For the same reason each one waits a week
# before proposing a release: a version yanked within days of publication
# would otherwise be a pull request that opens, runs that matrix, and is
# then closed.
#
# Monthly is now a cost decision rather than a visibility one, and the
# difference is worth writing down. It used to be both: with nothing else
# resolving afresh, five weeks was also how long an upstream break could sit
# unseen. latest.yml is that sentinel now -- weekly, off the critical path,
# and narrow, so it costs three platforms rather than the matrix -- which
# leaves this interval trading machine hours against the size of one diff
# and nothing else. btclib runs the same two ecosystems weekly for exactly
# that reason, its pull requests being cheap; here they are not, so the
# interval stays where it is and the early warning arrives by another route
version: 2
updates:
  # what this buys is the exact pins: every action is pinned to a commit
  # SHA, which nothing but this moves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      # one PR for all action bumps instead of one PR each
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # uv.lock is committed, the coverage job installs from it, and the
  # dependency groups declare no version at all: what pytest, ruff and
  # mypy resolve to for a developer is decided entirely by the lock file,
  # which nothing else moves. The linter versions that gate a pull
  # request are the pre-commit revisions, updated by pre-commit.ci; these
  # are what an editor and an ad hoc run see, and they should not drift
  # away from those
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      dev-tooling:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # signal upstream movement of the vendored secp256k1 submodule;
  # note: Dependabot tracks the upstream default branch, so releases
  # still need a manual bump to the tagged commit
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    cooldown:
      default-days: 7
