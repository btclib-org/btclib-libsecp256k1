# The wrapping, mutated. Coverage says every line of it runs -- the ratchet
# in pyproject.toml is at 100% and has no slack -- and this asks whether the
# suite would notice if one of those lines were wrong.
#
# The gap is not theoretical for this package, and the shape of its own code
# is why. What is hand-written here is a boundary: `if len(x) != 32: raise`,
# `if not 0 < scalar < n: raise`, a return code checked against zero. Change
# `!=` to `<=`, or 32 to 31, and the line still runs and coverage still
# reads 100% -- what kills that mutant is a test that passes 31 octets *and*
# one that passes 33.
#
# The first session answered that, and the answer was that not every bound
# had both: 383 survivors, `cr-rate --estimate` 49.68, on a tree at 100%
# statement coverage -- two numbers answering different questions, which is
# the whole reason this configuration exists. Of those 383, 341 were the
# inert shape described under excluded-modules below and 42 were real.
#
# The tests those 42 asked for are in tests/ now, and a second session
# measured 359 survivors: every comparison mutant on a size check dead but
# one, both loop mutants dead, and the four the second session still found
# -- three recid bounds and one message-hash check -- killed by hand
# afterwards, each mutation applied to the source and the suite watched to
# fail. What is left is 14 real survivors, in two shapes that cannot be
# killed by a test and are not holes:
#
#   ffi.new("size_t *", 73) -> 74 or 72, an output buffer for a
#   serialization libsecp256k1 sizes itself, writing what it needs and
#   updating the length: a buffer declared larger is harmless by design, and
#   one declared smaller still holds every value the function produces
#
#   secrets.token_bytes(32) -> 31 or 33, randomness this package generates
#   rather than accepts -- a BIP340 aux, an ellswift encoding, the context
#   seed. Its length is not observable in any answer: the aux is hashed, so
#   a shorter one produces a different signature that verifies just as well
#
# So read a survivor list expecting those two shapes and the annotations,
# and read anything else as a test nobody has written. The settled rate is
# whatever the next scheduled run reports; it is not restated here, a number
# in a comment being a line every change to the suite would have to edit.
#
# Here rather than at the repository root: cosmic-ray takes the path of its
# configuration as an argument, so nothing forces a name or a place, and
# .github/ is a directory check-manifest already ignores -- a root file
# would need an entry in [tool.check-wheel-contents] or the sdist to say
# what its location says here.
#
# One file where btclib has two, and the asymmetry that makes it want two is
# absent: there the two halves of the scope cost 1.1 s and 7.2 s of cpu per
# mutant, so one shared test command would make every cheap mutant pay the
# expensive one's price. Here the whole suite is the cheap command.

[cosmic-ray]
# the package, not one module: it is small enough that scoping it further
# would be excluding code from the question rather than dividing the work.
# 777 mutants, which `cosmic-ray init` enumerates in under a second.
# The vendored C is not in it and cannot be -- libsecp256k1 is upstream's,
# and what this repository is answerable for is how the bindings drive it
module-path = "btclib_libsecp256k1"

# the whole suite, which runs in well under a second, so the session cost
# is the process startup rather than the tests.
#
# -x stops at the first failure: a mutant needs one test to kill it, and the
# rest of the run is spent proving what is already known.
# -p no:randomly because pytest-randomly is in the test group: with -x the
# collection order decides which test does the killing, so a shuffled order
# makes both the runtime and a timeout verdict irreproducible.
# -q because the log is not a terminal.
#
# No --cov, and that is not an omission: addopts carries none, and the
# ratchet would fail every single run -- a mutant is reached by no test on
# purpose, so coverage would drop below 100 and report every mutant as
# killed by the gate rather than by a test
test-command = "python -m pytest -x -q -p no:randomly"

# seconds of wall clock. What this guards is a mutant that turns a bound
# into a loop with no exit, and nothing else. Wide rather than tight,
# because a timeout is a verdict of its own -- neither killed nor survived
# -- so every second of slack a loaded machine needs is a survivor not
# reported as noise. The suite takes under a second, so 120 is two orders of
# magnitude of slack and costs nothing except on the mutants that do hang
timeout = 120

# nothing: `_scalar` and `context` are as much the boundary as the wrappers
# are, and `__init__` more than either -- `_load_lib` is the one branch
# whose other half no build has, which is why it takes the module as an
# argument. A mutant surviving in there is worth knowing about.
#
# What is worth knowing before reading a survivor list: one shape of
# survivor is inert by construction. cosmic-ray mutates every expression it
# finds, annotations included, and these modules open with
# `from __future__ import annotations`, so `bytes | int` in a signature
# becomes `bytes >> int` and nothing ever evaluates it. Those cannot be
# killed and are not holes. `cr-filter-pragma` is the answer if they ever
# outnumber the real ones -- it marks `# pragma: no mutate` lines as skipped
# -- and it is deliberately not used yet: a pragma is a line of source added
# for the benefit of a weekly report
excluded-modules = []

# one mutant at a time, in this working tree. The local distributor writes
# the mutation into the file itself and restores it afterwards, so a second
# session -- or a pytest in another shell -- would read mutated source. The
# http distributor is what cosmic-ray offers instead, and it wants a worker
# per checkout: parallelism at the price of a clone each, for a session that
# already fits in the budget
[cosmic-ray.distributor]
name = "local"
