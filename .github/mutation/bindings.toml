# The wrapping, mutated. Coverage says every line of it runs -- the ratchet
# in pyproject.toml is at 100% and has no slack -- and this asks whether the
# suite would notice if one of those lines were wrong.
#
# The gap is not theoretical for this package, and the shape of its own code
# is why. What is hand-written here is a boundary: `if len(x) != 32: raise`,
# `if not 0 < scalar < n: raise`, a return code checked against zero. Change
# `!=` to `<=`, or 32 to 31, and the line still runs and coverage still
# reads 100% -- what kills that mutant is a test that passes 31 octets *and*
# one that passes 33.
#
# The first session answered that, and the answer was that not every bound
# had both: 383 survivors, `cr-rate --estimate` 49.68, on a tree at 100%
# statement coverage -- two numbers answering different questions, which is
# the whole reason this configuration exists. Of those 383, 341 were the
# inert shape the operator filter below now skips and 42 were real.
#
# The tests those 42 asked for are in tests/ now, and a second session
# measured 359 survivors: every comparison mutant on a size check dead but
# one, both loop mutants dead, and the four the second session still found
# -- three recid bounds and one message-hash check -- killed by hand
# afterwards, each mutation applied to the source and the suite watched to
# fail. What that left, 13 on the session that measured the filter below,
# was two shapes that no test could kill, and neither is there any more --
# because each was a question about the code rather than about the suite:
#
#   ffi.new("size_t *", 73) -> 74 or 72, the capacity of an output buffer,
#   written as a second copy of the buffer's own size. Six of the 13.
#   `ffi.sizeof` now derives the capacity from the buffer and the buffer is
#   what is unpacked, so a wrong size reaches the caller instead of being
#   absorbed -- and the DER buffer, sized 73 for a serialization that
#   cannot exceed 72, has a test for the octet that decides it
#
#   secrets.token_bytes(32) -> 31 or 33, randomness this package generates
#   rather than accepts: a BIP340 aux, an ellswift encoding, the context
#   seed. Seven of the 13, and unkillable through any answer -- a shorter
#   aux is hashed into a different signature that verifies just as well.
#   What holds them now is what is *asked* of `secrets` rather than what
#   comes back, so the context seed is randomized through a function taking
#   the context as an argument, the way `_load_lib` takes the module
#
# The session that measured that is in the pull request which made it true:
# 385 mutants executed, none surviving, 352 skipped. So read a survivor
# list expecting nothing, and read whatever is in it as a test nobody has
# written -- there is no longer a shape to skip past first. That is a
# statement about the shapes, not a promise about the rate: what the next
# scheduled run reports is what it reports, and it is not restated here, a
# number in a comment being a line every change to the suite would edit.
#
# Here rather than at the repository root: cosmic-ray takes the path of its
# configuration as an argument, so nothing forces a name or a place, and
# .github/ is a directory check-manifest already ignores -- a root file
# would need an entry in [tool.check-wheel-contents] or the sdist to say
# what its location says here.
#
# One file where btclib has two, and the asymmetry that makes it want two is
# absent: there the two halves of the scope cost 1.1 s and 7.2 s of cpu per
# mutant, so one shared test command would make every cheap mutant pay the
# expensive one's price. Here the whole suite is the cheap command.

[cosmic-ray]
# the package, not one module: it is small enough that scoping it further
# would be excluding code from the question rather than dividing the work,
# and a module added to it is in scope without this line being edited.
# `cosmic-ray init` enumerates the mutants in under a second, so how many
# there are is a command rather than a number here -- the sessions quoted
# below each name their own, being records of what one run measured.
# The vendored C is not in it and cannot be -- libsecp256k1 is upstream's,
# and what this repository is answerable for is how the bindings drive it
module-path = "btclib_secp256k1"

# the whole suite, which runs in well under a second, so the session cost
# is the process startup rather than the tests.
#
# -x stops at the first failure: a mutant needs one test to kill it, and the
# rest of the run is spent proving what is already known.
# -p no:randomly because pytest-randomly is in the test group: with -x the
# collection order decides which test does the killing, so a shuffled order
# makes both the runtime and a timeout verdict irreproducible.
# -q because the log is not a terminal.
#
# No --cov, and that is not an omission: addopts carries none, and the
# ratchet would fail every single run -- a mutant is reached by no test on
# purpose, so coverage would drop below 100 and report every mutant as
# killed by the gate rather than by a test
test-command = "python -m pytest -x -q -p no:randomly"

# seconds of wall clock. What this guards is a mutant that turns a bound
# into a loop with no exit, and nothing else. Wide rather than tight,
# because a timeout is a verdict of its own -- neither killed nor survived
# -- so every second of slack a loaded machine needs is a survivor not
# reported as noise. The suite takes under a second, so 120 is two orders of
# magnitude of slack and costs nothing except on the mutants that do hang
timeout = 120

# nothing: `_scalar` and `context` are as much the boundary as the wrappers
# are, and `__init__` more than either -- `_load_lib` is the one branch
# whose other half no build has, which is why it takes the module as an
# argument. A mutant surviving in there is worth knowing about. What is
# excluded here is an operator rather than a module, below
excluded-modules = []

# what a mutant of `bytes | int` is: nothing. Every module here opens with
# `from __future__ import annotations`, so an annotation is an unevaluated
# string, and cosmic-ray mutates the `|` inside it eleven ways --
# `bytes >> int` and ten more -- none of which any test can reach, because
# nothing ever evaluates the expression.
#
# Measured rather than argued, both sessions over this same scope: without
# the filter, 365 survivors of 777 mutants in 5 minutes; with it, 352
# skipped and 13 survivors of the 425 that ran, in 2. The two numbers say
# the same thing twice -- 365 - 13 = 352 -- so the filter takes out exactly
# the mutants that survived and not one that any test killed.
#
# The pattern is anchored on what is *replaced*, which is what leaves the
# one BitOr mutant a test does kill: `2**256` in _scalar.py mutated to
# `2 | 256` is `core/ReplaceBinaryOperator_Pow_BitOr`, so it does not match
# and it still runs, dying on the int scalar test written for it.
#
# Excluded by operator rather than with `# pragma: no mutate`, and the
# argument is where the decision lives. One line here, in the file that
# already says what is mutated and what judges it, against a marker on each
# of 26 library lines and again on every one a later signature adds. The
# price is the same either way and is paid here instead of there: a real
# `a | b` written into one of these modules would be skipped in silence, so
# the claim behind this line is a grep, and it is the claim to re-check
# rather than this comment:
#
#   grep -n ' | ' btclib_secp256k1/*.py
#
# Every hit today is an annotation, and there is no bitwise operator of any
# kind in the package -- no `^`, no `&`, no shift outside a doctest prompt --
# which is why the pattern excludes the BitOr family and nothing else. btclib
# keeps the same exclusion that narrow for the opposite reason: `^` is what
# one of its own checks is written with.
#
# What this does to the one number the workflow prints is why
# .github/scripts/mutation_counts.py exists: `cr-rate` counts anything that
# is not SURVIVED as a kill, a skip included, so on a filtered session it
# divides by mutants nothing ran
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]

# one mutant at a time, in this working tree. The local distributor writes
# the mutation into the file itself and restores it afterwards, so a second
# session -- or a pytest in another shell -- would read mutated source. The
# http distributor is what cosmic-ray offers instead, and it wants a worker
# per checkout: parallelism at the price of a clone each, for a session that
# already fits in the budget
[cosmic-ray.distributor]
name = "local"
