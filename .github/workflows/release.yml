---
name: release

# publish to PyPI with Trusted Publishing (OIDC): no long-lived PyPI
# token exists anywhere; PyPI trusts this very workflow (registered in
# the PyPI project settings under "Publishing") and hands out a
# short-lived upload token at run time.
# See RELEASING.md.

on:
  push:
    tags: ["v*"]
  # rehearsal: a manual run publishes to TestPyPI, a tag to PyPI, and
  # there is nothing to choose at dispatch time. A version cannot be
  # reuploaded to either index, so the one thing this workflow must not
  # do is reach PyPI when it was meant to be a trial run
  workflow_dispatch:

permissions:
  contents: read

# never cancel a release, unlike the gates it calls: what cancel-in-progress
# is right about elsewhere is that the subject of a run is a commit, which a
# newer commit supersedes. A publication is not -- a version is consumed by
# the upload that carries it, and a run cancelled between the two uploads
# leaves TestPyPI holding a version PyPI never got. Two tags pushed in a row
# queue instead. Named literally, for the reason lint.yml gives at length
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the same gates a push gets, all three of them: a release is not the
  # moment to discover that the tagged commit does not lint, does not build
  # its documentation, or does not pass the suite on a platform
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml
    with:
      # what keeps this run out of the branch concurrency groups: inside a
      # called workflow github.ref is the ref of this workflow's own run,
      # so without it a rehearsal dispatched on a branch and a push to that
      # branch share a group and cancel each other. The reasoning is in
      # lint.yml, next to the group; the value only has to be a string no
      # branch group can contain
      concurrency-suffix: "-release"

  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  # the platform test.yml does not run the suite on, for the reason its own
  # header measures: a week is the right sample rate for a regression that
  # can sit on main for a week, and the wrong one for a version that cannot
  # be unpublished
  macos:
    name: Run the macos workflow
    uses: ./.github/workflows/macos.yml
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  windows:
    name: Run the windows workflow
    uses: ./.github/workflows/windows.yml
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  # what a version cannot survive being wrong about, checked before
  # anything is built and long before anything is uploaded: a version is
  # consumed by the upload that carries it, and can then only be yanked.
  # The rehearsal runs this too, so a mismatch cannot wait for release
  # day to surface; only the tag comparison is release-only, there being
  # no tag to compare against otherwise
  version-check:
    name: Check the declared versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version-suffix: ${{ steps.suffix.outputs.version-suffix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history, and every branch with it: the ancestry
          # check below has nothing to read in the single commit the
          # default shallow clone fetches
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # off, unlike everywhere else, and not by omission: a cache is
          # written by the jobs of a pull request and restored by this one,
          # which runs on a tag and decides whether a release proceeds.
          # There is nothing to gain here anyway — the two commands below
          # install nothing — and the default of this action is to cache
          enable-cache: false

      # uv.lock carries the project version too, so a bump that was not
      # followed by uv lock leaves the two disagreeing, and the sdist
      # ships the lock file
      - name: Check that uv.lock is up to date
        run: uv lock --check

      - name: Check that the tag matches the declared version
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          echo "pyproject.toml declares $version"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $version"
            exit 1
          fi
          # the trigger picks the index, so a tagged pre-release goes to
          # PyPI itself: a v0.7.1rc1 tag on a tree declaring 0.7.1rc1
          # passes the comparison above and burns a version that --pre
          # installs would then resolve. RELEASING.md forbids it in words;
          # this is the check. Digits and dots only: the versioning scheme
          # of README.md, its fourth number included, and nothing PEP 440
          # reads as a pre-release, a dev build or a post release
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            hint="rehearse on TestPyPI via workflow_dispatch instead"
            echo "::error::$version is not a final version; $hint"
            exit 1
          fi

      # CONTRIBUTING.md and RELEASING.md both say a release is a tag on
      # a commit on main; nothing enforced it. The deployment tag policy
      # of the pypi environment constrains the *name* of the ref and
      # nothing else, so a v* tag on a branch head, on a stale state or
      # on a fork-synced commit reaches the environment exactly
      # as the release tag does -- and the reviewer approving sees the
      # tag name, not its ancestry. This is the ancestry, before the
      # matrix builds anything.
      # origin/main rather than a fetch of its own: the checkout above
      # takes the whole history, remote-tracking branches included, and a
      # missing origin/main fails the step, which is the safe way round
      - name: Check that the tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      # the fourth invariant, and the last one that was checked only
      # after the point of no return: github-release reads the tag's
      # section out of RELEASE_NOTES.md for the release notes, and a
      # section that is not there is a ::warning:: with generated notes
      # as the fallback -- correct there, PyPI having accepted the
      # upload already, and no use at all as the place the omission is
      # found.
      # The fallback downstream stays: it covers the release deleted by
      # hand and recreated.
      #
      # Existence is not the whole question, and asking only that is what
      # this step used to do. That fallback fires on an *empty* section,
      # and "## v0.8.0 (work in progress, not released yet)" is not empty:
      # it matches github-release's heading regex too, the tag being
      # followed by a space, so a forgotten retitle publishes the
      # work-in-progress text as the release notes and nothing says a
      # word. Step 2 of RELEASING.md is what drops those five words, and
      # until now nothing checked that it had been done.
      #
      # CHANGELOG.md is checked beside it because RELEASING.md retitles
      # the two together, and RELEASE_NOTES.md's section points at
      # CHANGELOG.md for the detail: a heading left open there makes
      # that a link into nothing. Matching btclib and bitcoin-core-rpc,
      # which carry this same step -- the awk is theirs, and the three
      # repositories now refuse the same tag for the same three reasons.
      #
      # Release-only, like the comparison above and for the same reason: a
      # rehearsal is what runs *before* the retitle, so requiring it there
      # would forbid the dry run it exists to be. The tag rather than
      # `uv version --short`, which the step above has just proven equal
      # to it, so the errors below name the ref that was pushed.
      # String comparison rather than a regex, so that the dots of the
      # version match dots and not any character, and awk rather than
      # grep, one pass answering all three questions
      - name: Check that the release notes are retitled for the tag
        if: github.event_name == 'push'
        run: |
          for file in RELEASE_NOTES.md CHANGELOG.md; do
            awk -v tag="$GITHUB_REF_NAME" -v file="$file" '
              $0 == "## " tag {heading = NR; next}
              index($0, "## " tag " ") == 1 {heading = NR; extra = $0; next}
              /^## / && heading {exit}
              heading && NF {body = 1}
              END {
                if (!heading) {
                  printf "::error::%s has no \"## %s\" section\n", file, tag
                  exit 1
                }
                if (extra) {
                  printf "::error::%s:%d is \"%s\"; the heading must be \"## %s\" alone\n",
                    file, heading, extra, tag
                  exit 1
                }
                if (!body) {
                  printf "::error::%s section \"## %s\" is empty\n", file, tag
                  exit 1
                }
                printf "%s has a non-empty \"## %s\" section\n", file, tag
              }
            ' "$file"
          done

      # the version of the wrapped library is a second thing this package
      # declares twice: the tag named in README.md, and the commit the
      # submodule is pinned to. The tag is resolved at the source rather
      # than through the submodule checkout, whose shallow clone carries
      # no tags
      - name: Check that README.md names the pinned libsecp256k1
        run: |
          named=$(sed -n 's|.*secp256k1/releases/tag/\(v[0-9][0-9.]*\).*|\1|p' README.md | head -1)
          pinned=$(git ls-tree HEAD secp256k1 | awk '{print $3}')
          upstream=https://github.com/bitcoin-core/secp256k1
          tagged=$(git ls-remote "$upstream" "refs/tags/$named^{}" | cut -f1)
          echo "README.md names $named ($tagged); the submodule is pinned to $pinned"
          if [ -z "$named" ] || [ -z "$tagged" ]; then
            echo "::error::README.md names no libsecp256k1 release, or one that does not exist"
            exit 1
          fi
          if [ "$tagged" != "$pinned" ]; then
            echo "::error::the submodule is pinned to $pinned, which is not $named"
            exit 1
          fi

      # a release ships the version the tree declares; a rehearsal cannot,
      # TestPyPI refusing a version it has already seen, so it appends a
      # .dev segment -- which sorts before the release it rehearses
      # whatever the number, PEP 440 ordering every dev release below the
      # release itself.
      #
      # The number is the run number and the attempt together, and the
      # attempt is the whole reason this is a step and not the expression
      # it used to be. A re-run keeps the run id *and* the run number of
      # the run it repeats; only run_attempt rises. So .dev<run number>
      # was unique per dispatch and identical across the re-runs of one,
      # and the collision surfaced as a TestPyPI 400 after the
      # three-quarters of an hour the matrix takes. Expressions have no
      # arithmetic, and concatenating the two numbers is unique only while
      # their digit counts happen to line up -- so the arithmetic happens
      # here, where the two digits reserved for the attempt can be
      # checked rather than assumed. The job that needs the value runs
      # after this one already
      - name: Compute the rehearsal version suffix
        id: suffix
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 99 ]; then
            echo "::error::attempt $GITHUB_RUN_ATTEMPT exceeds the two digits reserved for it"
            exit 1
          fi
          suffix=".dev$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "run $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT: $suffix"
          echo "version-suffix=$suffix" >> "$GITHUB_OUTPUT"

  # reuse the whole build/test pipeline: every artifact the release ships
  # is built and tested here, by the very matrices that run on a push
  test:
    name: Run the test workflow
    # a minute of checking, ahead of an hour of building: a tag that does
    # not match the tree is worth discovering before the matrices start
    needs: version-check
    uses: ./.github/workflows/test.yml
    # a called workflow's jobs are capped at what the caller grants here,
    # not at what the called workflow's own top-level default declares:
    # this workflow's contents: read alone left `changes`, which asks for
    # pull-requests: read to list a pull request's files, "only allowed
    # pull-requests: none" -- refused before a single job starts, version
    # -check included, rather than started and skipped for the one job
    # that asked for more. `changes` never runs on a pull request here --
    # it answers code=true unconditionally and reads no file list -- but
    # the check is against what the job declares, not against what it
    # goes on to do. contents: read is repeated rather than left to
    # test.yml's own default for the same reason: a caller's grant
    # replaces the callee's default outright, so anything this list
    # leaves off becomes none for every job over there, not only for the
    # one this comment names
    permissions:
      contents: read
      pull-requests: read
    with:
      # empty on the tag path, where the step computing it is skipped and
      # a skipped step's output is the empty string: a release ships the
      # version the tree declares
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}
      # see the lint job above
      concurrency-suffix: "-release"

  # the two publish jobs differ only in where they upload to, and are two
  # jobs rather than one parameterized by an expression on purpose. The
  # environment name is what enforces the manual approval: were it an
  # expression that failed to evaluate as intended, the job would run
  # against some other environment, publishing with no gate in front of
  # it. Nothing here is computed, so nothing can go that way.
  #
  # Both cap their runtime like every other job, the approval they wait
  # for notwithstanding: what timeout-minutes bounds is execution time,
  # which is also what the six-hour default bounds, while a run waiting
  # for an environment approval has a limit of its own, thirty days. The
  # reviewer can therefore take as long as they like, and a stuck upload
  # still cannot hold a runner for an afternoon
  publish-testpypi:
    name: Publish to TestPyPI
    # the repository condition keeps a fork from attempting an upload it
    # has no publisher for: a fork that pushes a tag, or dispatches this
    # workflow, gets the build and stops there
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'btclib-org/btclib-secp256k1'
    needs: [test, lint, docs, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/btclib_secp256k1
    permissions:
      # required by Trusted Publishing to request the OIDC token
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels-*"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -l dist

      # generates PEP 740 attestations by default
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    # see publish-testpypi for the repository condition
    if: github.event_name == 'push' && github.repository == 'btclib-org/btclib-secp256k1'
    needs: [test, lint, docs, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/btclib_secp256k1
    permissions:
      # required by Trusted Publishing to request the OIDC token
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels-*"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -l dist

      # generates PEP 740 attestations by default
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # the sdist reaches users by two routes and only one of them carried
  # provenance: the publish job above attaches a PEP 740 attestation to
  # the copy on the index, while the copy github-release attaches below
  # carried nothing at all. This job signs it, and the digest is the
  # index's own, the artifact being downloaded here rather than rebuilt.
  # The sdist alone, and not every file published: the wheels are attached
  # to no release, so their only public copy is the one PyPI already
  # attests, and a second attestation of a file nobody can obtain
  # elsewhere closes no gap.
  # A job of its own rather than two more permissions on github-release:
  # this workflow elevates one job at a time, and the one that writes
  # releases has no reason to also hold an OIDC token. Not in the build
  # matrix for the stronger form of the same reason -- those jobs compile
  # the vendored library and run the build backend, and a token minted
  # there is minted beside everything a build resolves.
  # After a publish rather than after the build, so that a run reaching
  # here is one the environment approval already let through: without
  # that, a dispatch from any branch would sign whatever that branch
  # built. Whichever publish ran, though -- the rehearsal signs its own
  # .dev sdist, and that is the point of running it there: everything in
  # this job is a permission and an API that would otherwise be exercised
  # for the first time on release day, where a failure lands after PyPI
  # has the files and the tag can no longer be moved
  attest:
    name: Attest the source distribution
    needs: [publish-pypi, publish-testpypi]
    # always(), the other publish job being skipped rather than run, and a
    # skipped job is one `needs` treats as failed
    if: >-
      always() && (needs.publish-pypi.result == 'success' ||
      needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # OIDC for the short-lived Sigstore signing certificate, and the
      # write that persists the attestation against the repository
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      # actions/attest, and not the attest-build-provenance wrapper: that
      # one is a composite whose only step is this action, pinned there to
      # v4.2.1, so calling it would leave the version that signs decided
      # by somebody else's pin rather than by the line below. No predicate
      # input is what selects SLSA build provenance, which is what the
      # wrapper's own name promises
      - name: Sign a build provenance statement for the sdist
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # the bundle is the signed statement itself, and the job below
      # attaches it to the release: that is what lets `gh attestation
      # verify --bundle` read it from disk instead of asking the
      # attestations API, for whoever mirrors the releases page rather
      # than trusting it live.
      # Copied into the workspace rather than uploaded where the action
      # left it, under $RUNNER_TEMP: an upload takes its layout from the
      # paths it matched, and one outside the workspace is one more thing
      # to be right about than a fixed name here
      - name: Collect the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.jsonl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation
          path: attestation.jsonl

  # only after PyPI has accepted the upload: a GitHub release announces
  # what can already be installed, and the download url in pyproject.toml
  # points at the page this creates.
  # Both jobs above in `needs`, and not attest alone: attest runs in a
  # rehearsal too, so naming it by itself would make this job cut a
  # release from a dispatch, where publish-pypi is skipped and a skipped
  # need is what keeps this to the tag.
  # `always()` is required here too, and an explicit `if` without it is
  # not enough to say so -- measured the hard way, twice. The first fix
  # added the two `.result` checks below and reasoned that was the whole
  # story: the implicit default asks a bigger question than this job has
  # reason to ask, so asking only about its own direct needs should have
  # been enough. v0.8.0.2 shipped with exactly that and was skipped all
  # the same, `publish-pypi` and `attest` both green. What actually
  # happens is structural, not a property of which question the `if`
  # asks: a job with a skipped job anywhere in its ancestry is
  # force-skipped regardless of its own condition, unless that condition
  # starts with `always()` (or `success()`/`failure()`) -- and that
  # override does not clear the taint for whoever depends on *it*.
  # attest's `always()` keeps attest itself from being skipped when
  # publish-testpypi is; github-release, needing attest, still sits
  # behind that same skipped ancestor and is force-skipped in turn unless
  # it also opts out on its own. Every job that crosses a skip has to say
  # `always()` for itself; the first fix said it for neither of the two
  # that needed it and the second still said it for only one.
  # v0.8.0, v0.8.0.1 and v0.8.0.2 all published clean and none produced a
  # GitHub release: recreated by hand from the run's own `sdist` and
  # `attestation` artifacts each time, which `gh run rerun --failed` does
  # not reach either way -- that flag reruns `failure`, and a structural
  # skip is neither a failure nor within its blast radius
  github-release:
    name: Attach the files to the GitHub release
    needs: [publish-pypi, attest]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # the one job that writes to the repository through its token, and
      # what it writes is a release; the statement the job above signed
      # went to the attestations API under permissions of its own
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the sdist alone: the wheels are on PyPI, with their attestations,
      # and thirty assets mirroring an index nobody would install from by
      # hand are noise. What belongs here is the source of the tag
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      # into a directory of its own, so that the dist/* glob below stays
      # the distribution files and nothing else
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation
          path: attestation

      - name: Create the release, with RELEASE_NOTES.md as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        # the notes are the tag's own section of RELEASE_NOTES.md; a
        # missing section is a warning rather than a failure, the upload
        # having already happened, and the notes then come from the
        # merged pull requests instead
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" {found=1; next}
            /^## / && found {exit}
            found {print}
          ' RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          # named for the tag only here, where the ref is one: nothing
          # inside the bundle says which release it belongs to, the way
          # the sdist's own file name does
          bundle="$GITHUB_REF_NAME.attestation.jsonl"
          cp attestation/attestation.jsonl "$bundle"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* "$bundle" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::RELEASE_NOTES.md has no $GITHUB_REF_NAME section"
            gh release create "$GITHUB_REF_NAME" dist/* "$bundle" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # the sentinel on what users can install, run at the one moment its answer
  # changes -- and a call rather than a workflow_run trigger, which zizmor
  # rates dangerous and rightly: that one runs the default branch's copy of a
  # workflow with a token nobody reviewed, where a call runs inside the
  # release that gated it, in its graph and in its log.
  # It waits for the index to serve the version this tag names before
  # installing anything, so it cannot pass by testing the release before this
  # one, and it runs beside github-release rather than before it: a release
  # announcing files that do not install is worse than a release announced a
  # few minutes later, but the announcement is not what makes them
  # installable
  published:
    name: Install the published version from PyPI
    needs: publish-pypi
    uses: ./.github/workflows/published.yml
    with:
      version: ${{ github.ref_name }}
