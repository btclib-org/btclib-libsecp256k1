---
name: lint

# fast gate, kept apart from the test workflow: the pre-commit hooks
# (formatting, linting, typing) are worthless unless something enforces
# them, and the build matrix is far too expensive to be the place where a
# style error surfaces. A workflow of its own is also what makes the
# distinction visible: two badges, two lines in the checks list, and a
# lint failure that no longer reads as "the build is red"

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups (refs/heads/<branch> against
    # refs/pull/N/merge) so neither cancels the other. The pull_request
    # run is the one worth keeping, because it tests the merge commit and
    # is the only run a fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it. Tag pushes are covered by the release workflow
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all
    types: [opened, reopened, synchronize, ready_for_review]
  # allows the release workflow to reuse this gate
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip dependencies, build scripts) can read the token, so it
# must not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR. The group is named
# literally, not through github.workflow: concurrency groups are
# per-repository, and what that context resolves to inside a called
# workflow is not documented (the explicit note covers job.workflow_ref
# only). Were it the caller's name, this workflow and every
# other one the release workflow calls would compute the same group, and
# cancel-in-progress would have each cancel the last: a release losing its
# lint gate, its docs build or its whole build matrix, on a path that runs
# once per release and where nobody is watching for a cancellation.
#
# github.ref has the same shape of problem one level down, and it is why
# the suffix is there. Inside a called workflow that context is the
# caller's ref, so a rehearsal -- a workflow_dispatch of release.yml on a
# branch, which is what RELEASING.md prescribes -- computes
# lint-refs/heads/<branch>, the very group a push to that branch or a
# direct dispatch of this workflow computes. One then kills the other:
# either the rehearsal dies mid-build, or it cancels the run of the push.
# A tag run is unaffected, refs/tags/v* being a ref nothing else uses.
# release.yml passes a suffix of its own, which keeps the release path
# out of the branch groups while still letting a second rehearsal of the
# same branch supersede the first
concurrency:
  group: lint-${{ github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    # a draft pull request is work in progress: every push to one runs
    # these checks on a tree its author is not asking anyone to review
    # yet. A run on the merge result still happens the moment the pull
    # request is marked ready, which is why ready_for_review is a
    # trigger type above
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # the hook environments are the slow part; they only change when
      # the pinned revisions in .pre-commit-config.yaml change
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # the wheels of the lint group, pre-commit itself among them;
          # the hook environments are the cache step above
          enable-cache: true

      # pre-commit from the lint group of pyproject.toml, pinned by
      # uv.lock, rather than from uvx, which fetched whatever the index
      # held that morning: this is the gate, and what a developer runs is
      # the locked version, so the gate was the one place the two could
      # diverge. --only-group omits the project, so linting still installs
      # no extension and compiles nothing; --locked asserts that uv.lock
      # matches pyproject.toml, which nothing rewrites on this path
      - name: Run pre-commit
        run: uv run --locked --only-group lint pre-commit run --all-files --show-diff-on-failure
