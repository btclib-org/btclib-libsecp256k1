name: main

on:
  push:
    branches: ["**"] # tag pushes are covered by the release workflow
  pull_request:
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip dependencies, build scripts) can read the token, so it
# must not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fast gate: the pre-commit hooks (formatting, linting, typing) are
  # worthless unless something enforces them, and the build matrix below
  # is far too expensive to be the place where a style error surfaces
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # the hook environments are the slow part; they only change when
      # the pinned revisions in .pre-commit-config.yaml change
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # uvx, not uv sync: linting does not need the project installed,
      # and installing it would mean compiling libsecp256k1 for nothing
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # coverage is a property of the python wrapper layer, not of the
  # platform: measuring it once is enough, and the fail_under ratchet in
  # pyproject.toml is what makes the number mean something
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # a static build, i.e. the worst case for coverage: the dlopen
      # fallback of __init__.py stays unreachable. The interpreter comes
      # from .python-version, as it does for a developer
      - name: Install lib and test tools
        run: uv sync --no-default-groups --group test

      - name: Test with coverage
        run: uv run pytest --cov

  build-cibuildwheel:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64; windows-latest and windows-11-arm build natively with
        # MSVC, which picks its target from the host, so win_amd64 and
        # win_arm64 need no configuration of their own. The vendored
        # library is built with CMake everywhere, provisioned as a build
        # requirement: no runner needs a toolchain installed by hand
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
        # macos-13 (the last Intel macOS runner) has long queue times:
        # run it only on master, on PRs targeting master, and on the tag
        # or the manual dispatch of a release, which have to build every
        # artifact that release ships
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('[]') || fromJSON('[{"os":"macos-13"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheels
        run: |
          python -m pip install -U pip build cibuildwheel
          cibuildwheel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-dynamic:
    name: Build dynamic wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
        # macos-13 (the last Intel macOS runner) has long queue times:
        # run it only on master, on PRs targeting master, and on the tag
        # or the manual dispatch of a release, which have to build every
        # artifact that release ships
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('[]') || fromJSON('[{"os":"macos-13"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install -U pip build
          BTCLIB_LIBSECP256K1_DYNAMIC=true python -m build -w

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -U auditwheel
          auditwheel repair dist/*

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install -U delocate
          delocate-wheel -w wheelhouse dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build source
        run: |
          python -m pip install -U pip build
          python -m build -s

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # installing from sdist is the one path that has to compile the
  # vendored libsecp256k1 on the user's machine: the wheel jobs never
  # exercise it, so a broken sdist would only be discovered on PyPI
  test-sdist:
    name: "Test sdist install on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: build-sdist

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Install from sdist
        run: |
          python -m pip install -U pip pytest
          python -m pip install --verbose dist/*.tar.gz

      - name: Test
        run: pytest

  build-windows:
    name: "Build on Linux for Windows"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: sudo apt install -y mingw-w64

      - name: Build Windows wheel
        run: |
          python -m pip install -U pip build wheel
          BTCLIB_LIBSECP256K1_CROSS_COMPILE=true CFFI_PLATFORM=Windows python -m build -w

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-wheels-windows
          path: dist/*

  # the same validation PyPI applies on upload, run before the release
  # workflow reaches the point of no return: broken metadata or a README
  # that does not render cannot be fixed by reuploading, a version can
  # only be yanked and burnt
  check-dist:
    name: Validate distributions
    runs-on: ubuntu-latest
    needs: [build-cibuildwheel, build-dynamic, build-sdist, build-windows]

    steps:
      # for the check-wheel-contents configuration in pyproject.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels-*"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -l dist

      - name: Check metadata and long description
        run: uvx twine check --strict dist/*

      - name: Check wheel contents
        run: uvx check-wheel-contents dist/*.whl

  test-dynamic:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
          ]
        python-version:
          [
            "3.9",
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "3.14t",
            "pypy-3.10",
            "pypy-3.11",
          ]
        # 3.14t, the free-threaded interpreter, matters here in particular:
        # the dynamic wheel is tagged py3-none, so it is what a
        # free-threaded interpreter installs, and unlike the static wheels
        # nothing else exercises it (cibuildwheel tests every wheel it
        # builds, including cp314t; this job has no such counterpart)
        #
        # macos-13 (the last Intel macOS runner) has long queue times:
        # run it only on master, on PRs targeting master, and on the tag
        # or the manual dispatch of a release, which have to build every
        # artifact that release ships
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('[]') || fromJSON('[{"os":"macos-13"}]') }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: [build-windows, build-dynamic]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dynamic-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest

  test-static:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
        python-version:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "pypy-3.11"]
        # cibuildwheel already runs the suite against every wheel it
        # builds, cp314t included: what this job adds is that pip, given a
        # directory holding all of them, selects the right one, which for
        # the free-threaded interpreter nothing checked.
        # PyPy wheels are not built on Windows, on either architecture.
        # CPython has no Windows arm64 build before 3.11, so there is no
        # interpreter to test a win_arm64 wheel against and cibuildwheel
        # does not produce one. macos-13 (the last Intel macOS runner) has
        # long queue times and only runs on master, on PRs targeting
        # master, and on the tag or the manual dispatch of a release
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('[{"os":"windows-latest","python-version":"pypy-3.11"},{"os":"windows-11-arm","python-version":"pypy-3.11"},{"os":"windows-11-arm","python-version":"3.9"},{"os":"windows-11-arm","python-version":"3.10"}]') || fromJSON('[{"os":"windows-latest","python-version":"pypy-3.11"},{"os":"windows-11-arm","python-version":"pypy-3.11"},{"os":"windows-11-arm","python-version":"3.9"},{"os":"windows-11-arm","python-version":"3.10"}, {"os":"macos-13"}]') }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: build-cibuildwheel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: static-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest
