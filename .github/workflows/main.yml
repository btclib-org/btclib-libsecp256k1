name: main

on: [push, pull_request]

# cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CIBW_BEFORE_BUILD_MACOS: "bash {project}/.github/scripts/install-macos-deps.sh"

jobs:
  build-cibuildwheel:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build wheels
        run: |
          python -m pip install -U pip build cibuildwheel
          cibuildwheel

      - uses: actions/upload-artifact@v7
        with:
          name: static-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-dynamic:
    name: Build dynamic wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-macos-deps.sh

      - name: Build wheel
        run: |
          python -m pip install -U pip build
          BTCLIB_LIBSECP256K1_DYNAMIC=true python -m build -w

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -U auditwheel
          auditwheel repair dist/*

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install -U delocate
          delocate-wheel -w wheelhouse dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build source
        run: |
          python -m pip install -U pip build
          python -m build -s

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-windows:
    name: "Build on Linux for Windows"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: sudo apt install -y mingw-w64

      - name: Build Windows wheel
        run: |
          python -m pip install -U pip build wheel
          BTCLIB_LIBSECP256K1_CROSS_COMPILE=true CFFI_PLATFORM=Windows python -m build -w

      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-wheels-windows
          path: dist/*

  test-dynamic:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
          ]
        python-version:
          [
            "3.9",
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "pypy-3.10",
            "pypy-3.11",
          ]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: [build-windows, build-dynamic]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@v8
        with:
          pattern: dynamic-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest

  test-static:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
        python-version:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: build-cibuildwheel

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@v8
        with:
          pattern: static-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest
