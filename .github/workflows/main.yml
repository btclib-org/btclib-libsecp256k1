name: main

on:
  push:
    branches: ["**"] # tag pushes are covered by the release workflow
  pull_request:
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip dependencies, build scripts) can read the token, so it
# must not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CIBW_BEFORE_BUILD_MACOS: "bash {project}/.github/scripts/install-macos-deps.sh"

jobs:
  build-cibuildwheel:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64; windows-latest builds natively with CMake/MSVC
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
          ]
        # macos-13 (the last Intel macOS runner) has long queue times:
        # run it only on master and on PRs targeting master
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/')) && fromJSON('[]') || fromJSON('[{"os":"macos-13"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheels
        run: |
          python -m pip install -U pip build cibuildwheel
          cibuildwheel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-dynamic:
    name: Build dynamic wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
        # macos-13 (the last Intel macOS runner) has long queue times:
        # run it only on master and on PRs targeting master
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/')) && fromJSON('[]') || fromJSON('[{"os":"macos-13"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-macos-deps.sh

      - name: Build wheel
        run: |
          python -m pip install -U pip build
          BTCLIB_LIBSECP256K1_DYNAMIC=true python -m build -w

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -U auditwheel
          auditwheel repair dist/*

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install -U delocate
          delocate-wheel -w wheelhouse dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build source
        run: |
          python -m pip install -U pip build
          python -m build -s

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  build-windows:
    name: "Build on Linux for Windows"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: sudo apt install -y mingw-w64

      - name: Build Windows wheel
        run: |
          python -m pip install -U pip build wheel
          BTCLIB_LIBSECP256K1_CROSS_COMPILE=true CFFI_PLATFORM=Windows python -m build -w

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-wheels-windows
          path: dist/*

  test-dynamic:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
          ]
        python-version:
          [
            "3.9",
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "pypy-3.10",
            "pypy-3.11",
          ]
        # macos-13 (the last Intel macOS runner) has long queue times:
        # run it only on master and on PRs targeting master
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/')) && fromJSON('[]') || fromJSON('[{"os":"macos-13"}]') }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: [build-windows, build-dynamic]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dynamic-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest

  test-static:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-13,
            macos-latest,
            windows-latest,
          ]
        python-version:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]
        # PyPy wheels are not built on Windows; macos-13 (the last Intel
        # macOS runner) has long queue times and only runs on master and
        # on PRs targeting master
        exclude: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master' || startsWith(github.ref, 'refs/tags/')) && fromJSON('[{"os":"windows-latest","python-version":"pypy-3.11"}]') || fromJSON('[{"os":"windows-latest","python-version":"pypy-3.11"},{"os":"macos-13"}]') }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: build-cibuildwheel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: static-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest
