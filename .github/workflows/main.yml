name: main

on: [push, pull_request]

env:
  CIBW_BEFORE_BUILD_MACOS: "bash {project}/.github/scripts/install-macos-deps.sh"

jobs:
  build-cibuildwheel:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest/macos-13 are x86_64, ubuntu-24.04-arm/macos-latest
        # are arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        run: |
          python -m pip install -U pip build cibuildwheel
          cibuildwheel

      - uses: actions/upload-artifact@v7
        with:
          name: static-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-dynamic-linux:
    name: Build dynamic wheel on linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install -U pip build wheel auditwheel
          BTCLIB_LIBSECP256K1_DYNAMIC=true python -m build -w
          auditwheel repair dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-wheels-linux
          path: ./wheelhouse/*

      - name: Build source
        run: python -m build -s -o wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./wheelhouse/*.tar.gz

  build-dynamic-macos:
    name: Build dynamic wheel on Macos
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bash .github/scripts/install-macos-deps.sh

      - name: Build wheel
        run: |
          python -m pip install -U pip build wheel delocate
          BTCLIB_LIBSECP256K1_DYNAMIC=true CFFI_PLATFORM=Darwin python -m build -w
          delocate-wheel -w wheelhouse dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-wheels-macos
          path: ./wheelhouse/*

  build-windows:
    name: "Build on Linux for Windows"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: sudo apt install -y mingw-w64

      - name: Build Windows wheel
        run: |
          python -m pip install -U pip build wheel
          BTCLIB_LIBSECP256K1_CROSS_COMPILE=true CFFI_PLATFORM=Windows python -m build -w

      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-wheels-windows
          path: dist/*

  test-dynamic:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        python-version:
          [
            "3.9",
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "pypy-3.10",
            "pypy-3.11",
          ]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: [build-windows, build-dynamic-linux, build-dynamic-macos]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@v8
        with:
          pattern: dynamic-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest

  test-static:
    name: "Test ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
        python-version:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      OS_NAME: ${{ matrix.os }}
    needs: build-cibuildwheel

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: python -m pip install -U pip pytest

      - name: Show runner information
        run: |
          python --version
          pip --version

      - uses: actions/download-artifact@v8
        with:
          pattern: static-wheels-*
          merge-multiple: true
          path: dist

      - name: Install lib
        run: |
          python -m pip install cffi
          python -m pip install --verbose --no-index --find-links dist/ btclib_libsecp256k1

      - name: Test
        run: pytest
