---
name: test

# the merge gate: everything this package ships, built and then tested on
# the platforms it claims, minus the two platforms a reviewer would wait
# for. Their suite cells are macos.yml's and windows.yml's, and each file
# carries the measurement that moved it; the wheel builds for all six stay
# here, because the release publishes the artifacts of this run.
#
# macOS was the first of the two, and the split is a measurement rather than
# a preference. Over six pull request runs of this workflow, ninety-eight jobs
# each, thirty-five of them on the two macOS images: a macOS job waited 20.8
# and 19.0 minutes on average for a runner, against 2.1 to 2.6 elsewhere,
# and the wait grows with the number of cells asking at once -- in the
# slowest of the six the macOS suite cells took the last thirty places
# before the aggregate, their queue rising from 16.7 to 70.2 minutes, and
# the run took 95 minutes for 105 minutes of work spread over 98 jobs. The
# command that re-derives it, for whoever doubts the split later:
#
#     id=$(gh run list --workflow=test.yml --limit 1 \
#         --json databaseId --jq '.[0].databaseId')
#     gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100"
#
# The Windows cells were the second, and a different number moved them:
# GitHub Free gives an organization twenty concurrent jobs, shared across
# every repository in it, and this workflow set asked for seventy-three on
# every commit. The twenty-one Windows suite cells were 27.3 of the 112.9
# runner-minutes, the largest family of jobs in the run and ahead of every
# wheel build. windows.yml has the rest of that measurement.
#
# So the macOS *suite* cells moved to macos.yml, which runs them weekly and
# before a release. The macOS *wheel builds* stay here, and the same
# measurement is why: the release publishes the artifacts of this run, so a
# macOS wheel not built here is a macOS wheel not on PyPI -- and those four
# jobs are not what stretched the run, finishing at 24.6 minutes against the
# 23.5 of the ubuntu-latest build beside them. Four macOS jobs queue;
# thirty-one contend.

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups for every pull_request action except
    # closed on a merge -- see that trigger's own comment below, and the
    # concurrency block, for why closed is the exception and how the
    # group now avoids it. The pull_request run is the one worth
    # keeping, because it tests the merge commit and is the only run a
    # fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it. Tag pushes are covered by the release workflow
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed joins them for a different reason: merging or closing a pull
    # request is neither a push nor a synchronize, so a run still held in
    # this pull request's own concurrency group survives it --
    # cancel-in-progress only fires when a new run lands in that group,
    # and nothing otherwise does. Landing the closed event there is what
    # lets it supersede the stale run instead of leaving it to finish on
    # a branch nobody is going to look at again; every job below
    # declines the real work on it, the merge commit being main's own
    # push trigger's question. "This pull request's own group" is the
    # part github.ref alone got wrong: for a closed, merged pull request
    # it resolves to the base branch's ref, the same one the push
    # trigger's own run computes, so the closed run landed in *that*
    # group instead and would cancel the run testing the actual merge
    # commit -- observed doing exactly that to bitcoin-core-rpc's own
    # main, after its #136 merged there. The concurrency block below
    # groups by the pull request's own number instead, immune to that
    # collision under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:
    inputs:
      version-suffix:
        description: >
          Appended to the version in pyproject.toml before anything is
          built, by every build job. A release passes nothing and ships
          the version the tree declares; the rehearsal passes a .dev
          suffix, which is how it reaches TestPyPI with a version that
          index has not already consumed.
        type: string
        default: ""
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: the matrix on demand for a branch whose pull
  # request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip dependencies, build scripts) can read the token, so it
# must not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR; named literally rather
# than through github.workflow, and discriminated by an input rather than
# left to github.ref alone, for the three reasons given in lint.yml
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the cheapest job in the workflow, and the one that decides whether the
  # rest of it runs at all: a pull request that edits only prose no
  # artifact carries cannot change what any of the jobs below build, and
  # was spending the whole matrix to prove it. Every root job takes this
  # one as a `needs` and reads its output; the jobs downstream of those
  # skip on their own, a job whose needs are skipped being skipped too.
  #
  # Three things this must not get wrong:
  #
  # - it runs on every trigger, and answers `true` on all but one. A
  #   `changes` job that skipped itself off the pull_request path would
  #   leave every dependent reading an empty output, which is not 'true',
  #   and the whole workflow would skip on main and on a release
  # - README.md is not prose for this purpose. It is the long description
  #   of the package, and check-dist renders it with twine and rates it
  #   with pyroma, so an edit to it is a change the matrix can fail on
  # - test-passed takes this job as a `needs` as well, so a failure here
  #   fails the gate. Without that, an error listing the files would skip
  #   everything and be reported as a pass
  changes:
    name: Decide whether the matrix has anything to check
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the file list of a pull request, which contents: read does not carry
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}

    steps:
      - name: Ask which files the pull request touches
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # a push to main, a release call and a dispatch build everything:
          # only a pull request has a base to be a diff against
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT is not a pull request: everything runs"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate \
            --jq '.[].filename' > files.txt
          echo "files changed:"
          cat files.txt
          # the allowlist is what nothing built reads: the prose files of
          # the root and of .github, and neither README.md nor a file
          # under docs/, which the sdist carries. An empty list is not a
          # documentation change, it is a question this could not answer,
          # so the count is checked before the pattern.
          #
          # The mutation configuration and the detect-secrets baselines are
          # on it for the same reason as the prose and were measured off it:
          # a change to bindings.toml alone cost 23 jobs and 45.7
          # runner-minutes (#239), and cosmic-ray takes that path as an
          # argument from mutation.yml, which is a workflow the matrix does
          # not contain. A baseline is detect-secrets' own output, read by a
          # hook -- and by lint.yml, which has no changed-file gate at all,
          # so a malformed one is still caught by the job that catches it
          # today.
          #
          # Anchored on the *file* and not on the directory, which is the
          # same staleness this comment declines below in the direction that
          # looks cheap: `^\.github/mutation/` would exempt in advance any
          # file a later change drops there, and two tests already load a
          # script by path one directory over (`.github/scripts/`), so such
          # a script would skip the matrix and take its own test with it.
          # `.toml` rather than `bindings\.toml` so a second configuration
          # needs no edit here; a script belongs in .github/scripts/, which
          # is where the three of them are.
          #
          # A workflow is *not* on it, deliberately, and that is the answer
          # to the other half of #239 rather than an omission. Which
          # workflows the matrix reads is a judgement -- this file and what
          # it calls, plus release.yml -- and naming the rest would be right
          # today and stale the first time a sentinel is folded into the
          # gate or one of these is split out, both of which have happened
          # here. A stale list of that kind skips a matrix that should have
          # run, which is the expensive direction; leaving every workflow
          # change to run everything is the cheap one, at the cost this
          # comment now records
          prose='^(CHANGELOG|CLAUDE|CONTRIBUTING|RELEASE_NOTES|RELEASING|REPOSITORY|SECURITY)\.md$|^\.github/[^/]*\.md$|^\.github/mutation/[^/]*\.toml$|^\.secrets\..*baseline$'
          if [ ! -s files.txt ] || grep -qvE "$prose" files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "something the matrix reads changed: everything runs"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "prose only: the matrix has nothing to check"
          fi

  # coverage is a property of the python wrapper layer, not of the
  # platform: measuring it once is enough, and the fail_under ratchet in
  # pyproject.toml is what makes the number mean something
  coverage:
    name: Measure coverage, gated at 100%
    # a draft pull request is work in progress: every push to one spends
    # the whole matrix on a tree its author is not asking anyone to
    # review yet. The gate below carries the same condition, so a draft
    # skips uniformly and the gate does not read that skip as a job that
    # should have run. A run on the merge result still happens the moment
    # the pull request is marked ready, which is why ready_for_review is a
    # trigger type above.
    # A closed pull request spends none either: the trigger above takes
    # the closed event only to let cancel-in-progress supersede a run
    # still holding in this ref's group, and every job in this workflow
    # carries the same skip for the reason the draft one already does
    if: >-
      ${{ !github.event.pull_request.draft
      && needs.changes.outputs.code == 'true'
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # every job below caps its own runtime, this one included: the default
    # is six hours, and with tens of jobs compiling C a single hang is
    # measured in runner days rather than minutes. The values sit well
    # above what these jobs are observed to take — nine minutes for a
    # wheel build, under three for everything else — so a slow runner is
    # not a failure, while a hung one is
    timeout-minutes: 15

    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the wheels of the test group, not the extension: the root
          # project is installed editable, so its build hook (and the
          # CMake build of the vendored library) runs on every job either
          # way. What this saves is the download, keyed on uv.lock
          enable-cache: true

      # a static build, i.e. the worst case for coverage: the dlopen
      # fallback of __init__.py stays unreachable. The interpreter comes
      # from .python-version, as it does for a developer.
      # One command, not a sync followed by a run: uv run syncs the
      # environment itself, and with the flags left off it did so against
      # the default groups, installing the twenty-nine packages of dev
      # right after the sync had deliberately installed ten.
      # --locked asserts that uv.lock matches pyproject.toml, which a
      # plain sync would quietly fix by re-locking instead
      - name: Test with coverage
        run: uv run --locked --no-default-groups --group test pytest --cov

  build-cibuildwheel:
    name: Build wheels on ${{ matrix.os }}
    if: >-
      ${{ !github.event.pull_request.draft
      && needs.changes.outputs.code == 'true'
      && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # the interpreter uv runs the build tools with is the one setup-python
    # installed below, and never one of uv's own: there is no managed
    # CPython for windows aarch64, so on windows-11-arm what uv downloads
    # is an emulated x86-64 build, and cibuildwheel reads the host
    # architecture off the interpreter it is running on — this job would
    # quietly produce win_amd64 wheels on the arm64 runner. With downloads
    # off, an interpreter that is missing is a job that fails instead
    env:
      UV_PYTHON_DOWNLOADS: never
    strategy:
      # as for the test matrices, and here it costs more: with the
      # default, one platform failing (or one flaky runner) cancels the
      # five builds in flight beside it, so a rerun is the only way to
      # learn whether they would have succeeded. On the release path the
      # cancelled jobs are artifacts the publish job then has to do
      # without
      fail-fast: false
      matrix:
        # ubuntu-latest/macos-26-intel are x86_64,
        # ubuntu-24.04-arm/macos-latest are arm64; windows-latest and
        # windows-11-arm build natively with MSVC, which picks its target
        # from the host, so win_amd64 and win_arm64 need no configuration
        # of their own. The vendored library is built with CMake
        # everywhere, provisioned as a build requirement: no runner needs
        # a toolchain installed by hand.
        # Actions drops x86_64 macOS in August 2027, after which no runner
        # can build a macosx x86_64 wheel at all
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm

    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # the interpreter the dev-version action runs and the one uv runs the
      # build tools with, which is why it stays even though cibuildwheel
      # needs none of its own: the interpreters it builds wheels for are
      # the ones it installs itself
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # skipped on every trigger but a release rehearsal: the inputs
      # context is empty unless this workflow was called, and an empty
      # string is what the release passes for a tag push
      - uses: ./.github/actions/dev-version
        if: inputs.version-suffix != ''
        with:
          suffix: ${{ inputs.version-suffix }}

      # cibuildwheel from the build group of pyproject.toml, pinned by
      # uv.lock, rather than from `pip install -U`, which fetched whatever
      # the index held that morning: what it decides — the interpreters,
      # the manylinux images, the identifiers the skip in
      # [tool.cibuildwheel] names — is this matrix, so a release of it
      # belongs in a pull request that runs the matrix rather than in a
      # push that did not touch it. --only-group omits the project, so
      # this installs no extension of its own; the build frontend
      # cibuildwheel then runs per interpreter comes from the same group.
      # --frozen, not the --locked of the check-dist job: the step above
      # rewrites the version in pyproject.toml on the rehearsal path,
      # which is exactly the disagreement --locked refuses. That the lock
      # is in step with pyproject.toml is asserted where it can be, by the
      # uv-lock hook on every commit and by `uv lock --check` in the
      # release workflow
      # what a pull request has to answer about macOS and Windows is
      # whether this tree still builds there, and that is answered by the
      # first wheel: the toolchain, the CMake build of the vendored
      # library and the cffi extension are what differ per platform, and
      # they do not differ per interpreter. The other six wheels of those
      # images are that build again for another ABI tag, and the four jobs
      # they happen in were 39.0 of the 59.5 runner-minutes the six wheel
      # jobs cost. Measured on the run of the change itself, those four
      # came to 7.2: 14.4 and 5.7 on the two macOS images became 1.5 and
      # 1.2, and 8.7 and 10.2 on the two Windows ones became 1.8 and 2.7.
      #
      # The two ubuntu images keep the whole set, because suite-static
      # consumes it: what that job exists to check is pip's selection
      # among a directory of wheels tagged for seven interpreters, and a
      # directory holding one is not that question.
      #
      # A push to main, a release and a rehearsal all build everything --
      # in a called workflow github.event_name is the caller's, which is
      # never pull_request -- so the interpreter this does not reach on a
      # branch is reached by the run that follows the merge, and the
      # release publishes nothing this shortcut has touched
      - name: Build one interpreter where a pull request only asks whether it builds
        if: >-
          github.event_name == 'pull_request'
          && !startsWith(matrix.os, 'ubuntu')
        # bash, and the two Windows images are the whole of the reason:
        # the default shell there is PowerShell, where "$GITHUB_ENV" is
        # not the variable but a literal, so this wrote a file of that
        # name and cibuildwheel built all seven wheels anyway -- the step
        # green, the log showing cp310 through cp314t, and only the
        # unchanged job duration to say so
        shell: bash
        run: echo "CIBW_BUILD=cp314-*" >> "$GITHUB_ENV"

      # this job's own matrix carries windows-latest and windows-11-arm,
      # the same reason the step above already declares shell: bash --
      # see its comment. This step is one plain command and runs
      # identically under PowerShell today; the hazard is the same one
      # that step's comment names for the next edit that is not
      # (issue btclib-org/btclib#1148)
      - name: Build wheels
        shell: bash
        run: uv run --frozen --only-group build cibuildwheel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-dynamic:
    name: Build dynamic wheel on ${{ matrix.os }}
    if: >-
      ${{ !github.event.pull_request.draft
      && needs.changes.outputs.code == 'true'
      && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # see build-cibuildwheel; here the platform tag of the wheel is the
    # interpreter's own, so substituting the interpreter substitutes the
    # tag
    env:
      UV_PYTHON_DOWNLOADS: never
    strategy:
      # see build-cibuildwheel
      fail-fast: false
      matrix:
        # ubuntu-latest/macos-26-intel are x86_64,
        # ubuntu-24.04-arm/macos-latest are arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26-intel, macos-latest]

    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # see build-cibuildwheel
      - uses: ./.github/actions/dev-version
        if: inputs.version-suffix != ''
        with:
          suffix: ${{ inputs.version-suffix }}

      # a dynamic wheel compiles no extension, so nothing derives its
      # platform tag from a toolchain: without this the macOS version in
      # the tag is the runner's own, and pip on any older macOS refuses a
      # wheel that would have loaded there. CMake reads the same variable
      # (CMAKE_OSX_DEPLOYMENT_TARGET defaults to it), so the vendored
      # library is built for the floor its tag then claims. 11.0 is where
      # arm64 macOS starts; 10.13 is what cibuildwheel gives the static
      # x86_64 wheels of CPython 3.12 and later, and the Xcode of the
      # macOS 26 image still compiles for it
      - name: Set the macOS deployment target
        if: runner.os == 'macOS'
        # the expression is a step env var rather than text spliced into
        # the script: what reaches the shell is then a value and never a
        # fragment of a command, which is the shape zizmor asks for
        env:
          TARGET: ${{ matrix.os == 'macos-26-intel' && '10.13' || '11.0' }}
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=$TARGET" >> "$GITHUB_ENV"

      # the build group and --frozen: see build-cibuildwheel
      - name: Build wheel
        run: BTCLIB_LIBSECP256K1_DYNAMIC=true uv run --frozen --only-group build python -m build -w

      # auditwheel and delocate decide the platform tag this wheel ends up
      # carrying, which is what pip matches against, so they are pinned
      # with the rest of the build group rather than installed with -U
      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: uv run --frozen --only-group build auditwheel repair dist/*

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: uv run --frozen --only-group build delocate-wheel -w wheelhouse dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  build-sdist:
    name: Build sdist
    if: >-
      ${{ !github.event.pull_request.draft
      && needs.changes.outputs.code == 'true'
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # see build-cibuildwheel
    env:
      UV_PYTHON_DOWNLOADS: never

    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # see build-cibuildwheel
      - uses: ./.github/actions/dev-version
        if: inputs.version-suffix != ''
        with:
          suffix: ${{ inputs.version-suffix }}

      # the build group and --frozen: see build-cibuildwheel
      - name: Build source
        run: uv run --frozen --only-group build python -m build -s

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # installing from sdist is the one path that has to compile the
  # vendored libsecp256k1 on the user's machine: the wheel jobs never
  # exercise it, so a broken sdist would only be discovered on PyPI.
  # Nothing upstream of here makes this job redundant, and it is worth
  # saying why, because for a pure python package it would be: `uv build`
  # builds the sdist and then the wheel *from* it, so whatever the wheel
  # contains proves the sdist carried it. No wheel of this package is
  # built that way — cibuildwheel and `python -m build -w` both build from
  # the source tree, per platform and per interpreter, because a wheel
  # here is a compiled artifact and the sdist is not its input. What the
  # sdist has to carry is therefore checked nowhere else: the whole
  # vendored submodule tree, the CMake toolchain file, the build scripts
  # named in cffi_modules, and the headers the cdef is preprocessed from,
  # every one of them listed by hand in the sdist include of
  # pyproject.toml. An omission there is invisible until something
  # compiles from it, which is what this job does.
  # Windows is in the matrix because it is the platform where that build
  # is least like the others: MSVC compiles the extension while a gcc on
  # the PATH preprocesses the headers for cffi, and what the sdist has to
  # carry for it is not what a POSIX build reads
  suite-sdist:
    name: >-
      Install from the sdist and run the suite on ${{ matrix.os }}${{
      matrix.architecture && format(' ({0})', matrix.architecture) }}
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is macos.yml's, for the reason the header gives; what that
        # workflow runs there is a source build of the same tree, which is
        # what an install from the sdist is
        os: [ubuntu-latest, windows-latest]
        # the wheel jobs all build with an interpreter of the runner's own
        # architecture, so nothing else exercises a build whose target is
        # not the host: an emulated x86-64 interpreter on Windows arm64,
        # which is what uv installs there by default, and where CMake
        # taking the host architecture left every libsecp256k1 symbol
        # unresolved at link time. This is the platform where an
        # architecture can be requested that is not the runner's, and the
        # sdist is the path that compiles on the user's machine
        include:
          - os: windows-11-arm
            architecture: x64
    needs: build-sdist

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          # empty for every other entry, which leaves setup-python its
          # default, the architecture of the runner
          architecture: ${{ matrix.architecture }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      # bash on every runner, Windows included: pip does not expand the
      # glob itself, and PowerShell does not expand it for a native
      # command either, so the default shell there would hand pip the
      # pattern verbatim.
      #
      # pip and pytest unpinned, unlike every tool that comes from a group
      # of pyproject.toml, and deliberately: this job and the two wheel
      # test jobs hold no uv and no lock, because their subject is pip
      # resolving and building a published artifact the way a user does,
      # and pinning pytest would reintroduce the resolution they exist to
      # exclude. The price is that filterwarnings = error makes a pytest
      # release able to fail these jobs on a day nothing here changed;
      # that is the same signal the published workflow carries, a fact
      # about what a user hits, and it surfaces in a pull request
      - name: Install from sdist
        shell: bash
        run: |
          python -m pip install -U pip pytest
          python -m pip install --verbose dist/*.tar.gz

      # this job's matrix carries windows-latest and windows-11-arm, the
      # same reason the step above already declares shell: bash. `pytest`
      # alone has no POSIX-only syntax and runs identically under
      # PowerShell today; the hazard is the next edit that adds some
      # (issue btclib-org/btclib#1148)
      - name: Test
        shell: bash
        run: pytest

  build-windows:
    name: "Build on Linux for Windows"
    if: >-
      ${{ !github.event.pull_request.draft
      && needs.changes.outputs.code == 'true'
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # see build-cibuildwheel
    env:
      UV_PYTHON_DOWNLOADS: never

    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # see build-cibuildwheel
      - uses: ./.github/actions/dev-version
        if: inputs.version-suffix != ''
        with:
          suffix: ${{ inputs.version-suffix }}

      - name: Install dependencies
        run: sudo apt install -y mingw-w64

      # the build group and --frozen: see build-cibuildwheel. The `wheel`
      # this used to install with it is a setuptools-era requirement:
      # hatchling writes the wheel itself, and nothing here invokes that
      # package
      - name: Build Windows wheel
        run: |
          BTCLIB_LIBSECP256K1_CROSS_COMPILE=true CFFI_PLATFORM=Windows \
            uv run --frozen --only-group build python -m build -w

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-wheels-windows
          path: dist/*

  # the same validation PyPI applies on upload, run before the release
  # workflow reaches the point of no return: broken metadata or a README
  # that does not render cannot be fixed by reuploading, a version can
  # only be yanked and burnt
  check-dist:
    name: Inspect the distribution files and install one
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-cibuildwheel, build-dynamic, build-sdist, build-windows]

    steps:
      # for the check-wheel-contents configuration in pyproject.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the wheels of the check group, the three tools below among
          # them, keyed on uv.lock
          enable-cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels-*"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -l dist

      # the three tools below come from the check group of
      # pyproject.toml, pinned by uv.lock, rather than from uvx, which
      # fetches whatever the index holds at run time: pyroma is run with a
      # --min ratchet, and a release of it adding a test would otherwise
      # fail a release that changed nothing. --only-group omits the
      # project, so none of this compiles an extension
      - name: Check metadata and long description
        run: uv run --locked --only-group check twine check --strict dist/*

      - name: Check wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl

      # what check-wheel-contents cannot phrase without also refusing the
      # compiled artifact this project's wheels legitimately carry outside
      # any package tree: docs/source/package-content-policy.md has the
      # three questions this answers and why check-wheel-contents --package
      # is not one flag away from asking them here. --no-project, so it
      # runs on the interpreter uv already fetched and installs nothing
      - name: Check what the wheels contain
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/verify_wheel_contents.py dist/*.whl

      # the wheel test jobs install cffi by hand and then the wheel with
      # --no-index, which resolves nothing: what the metadata declares is
      # only ever checked against a cffi that is already installed, so a
      # requirement dropped from it would go unnoticed by all of them.
      # Here one wheel is installed by path into an environment holding
      # nothing, its dependencies resolved from PyPI, and imported from an
      # empty directory, where nothing can resolve to the source tree. The
      # dynamic wheel is the subject because it is the one that needs cffi
      # at run time, a static extension carrying its own
      - name: Install a wheel with its dependencies resolved from PyPI
        run: |
          # the glob itself, not ls parsed by a pipeline: nullglob is what
          # makes an unmatched pattern an empty array rather than the
          # pattern read as a filename
          shopt -s nullglob
          wheels=("$PWD"/dist/*py3-none-manylinux*x86_64.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::dist holds no dynamic linux x86_64 wheel"
            exit 1
          fi
          wheel=${wheels[0]}
          echo "installing $wheel"
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.14 --with "$wheel" \
            python -c "import btclib_secp256k1 as m; print(m.__version__, m.lib)"

      # what twine cannot see: metadata that is valid but poor, a missing
      # classifier or url, a version PyPI would sort in a way nobody
      # meant. Run on the sdist rather than on the source tree, so it
      # rates the metadata that was actually built and shipped; --min 10
      # is a ratchet, the score being 10 today
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz

  suite-dynamic:
    # the linkage is in the name, and it has to be: this job and the one
    # below run the same interpreters on the same images against two
    # different wheels, so one name for both produced two check runs
    # called the same thing -- and a branch rule matches a context by name
    # alone, which is what makes an ambiguous one worth avoiding even where
    # no rule names it today
    name: >-
      Run the suite on the dynamic wheel,
      every interpreter, ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    # one job now walks what eight did, so the cap is the sum of theirs
    # rather than one of them: eight installs and eight suites in
    # sequence, where each cell was under two minutes
    timeout-minutes: 30
    env:
      # one statement of which interpreters are tested, read twice in this
      # job: setup-python installs the list, and the loop below walks it.
      # A version added to one and not the other is either an interpreter
      # installed and never run or a run that fails on a missing
      # executable, and both say so immediately.
      # 3.14t, the free-threaded interpreter, matters here in particular:
      # the dynamic wheel is tagged py3-none, so it is what a
      # free-threaded interpreter installs, and unlike the static wheels
      # nothing else exercises it (cibuildwheel tests every wheel it
      # builds, including cp314t; this job has no such counterpart)
      PYTHONS: |
        3.10
        3.11
        3.12
        3.13
        3.14
        3.14t
        pypy-3.10
        pypy-3.11
    strategy:
      fail-fast: false
      matrix:
        # the macOS images are macos.yml's and the Windows ones are
        # windows.yml's; see the header
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    needs: [build-windows, build-dynamic]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # every interpreter of PYTHONS at once: setup-python takes a list and
      # puts each on the PATH under its own name, which is what lets one
      # job do what one cell per version did
      - name: Set up every interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHONS }}

      # only the wheel built for this platform: downloading all of them
      # meant every job in the matrix listing and fetching four
      # artifacts to install one, and the artifact service answers a
      # fan-out that wide with the occasional 403. The x86_64 Windows
      # wheel is the mingw cross-compiled one, hence its artifact name
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynamic-wheels-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os }}
          path: dist

      # pip and pytest unpinned, and for the reason spelled out in
      # suite-sdist: a user's environment rather than the locked one.
      #
      # What a red check says is what this trades away, and the loop is
      # written to give it back: a matrix cell named the interpreter in the
      # check itself, where this job names the image and leaves the
      # interpreter to the log. So every version runs even after one has
      # failed -- `fail-fast: false` between cells, kept between iterations
      # -- each inside a fold of its own, and the failures are named
      # together at the end rather than being the first one to abort
      - name: Install the wheel and run the suite under each interpreter
        run: |
          failed=""
          for version in $PYTHONS; do
            case $version in
              pypy-*) python=pypy${version#pypy-} ;;
              *) python=python$version ;;
            esac
            echo "::group::$version ($python)"
            if "$python" --version \
              && "$python" -m pip install -U pip pytest cffi \
              && "$python" -m pip install --verbose --no-index \
                --find-links dist/ btclib_secp256k1 \
              && "$python" -m pytest; then
              echo "$version passed"
            else
              failed="$failed $version"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::the suite failed under:$failed"
            exit 1
          fi

  suite-static:
    # the linkage is in the name: see suite-dynamic
    name: >-
      Run the suite on the static wheel,
      every interpreter, ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    # see suite-dynamic, one interpreter fewer
    timeout-minutes: 30
    env:
      # one statement of the interpreters, as in suite-dynamic, and one
      # shorter by pypy-3.10: no static wheel is built for it.
      # cibuildwheel already runs the suite against every wheel it builds,
      # cp314t included: what this job adds is that pip, given a directory
      # holding all of them, selects the right one, which for the
      # free-threaded interpreter nothing checked
      PYTHONS: |
        3.10
        3.11
        3.12
        3.13
        3.14
        3.14t
        pypy-3.11
    strategy:
      fail-fast: false
      matrix:
        # the macOS images are macos.yml's and the Windows ones are
        # windows.yml's; see the header. What is given up there is narrower
        # than elsewhere, and cibuildwheel is why: it runs the suite against
        # every wheel it builds, on the runner that built it, so the macOS
        # and Windows wheels this workflow ships are still tested by the job
        # that produces them. What moves is pip's selection among them.
        # With both Windows rows gone so are the three exclusions they
        # carried, each of them a wheel that is not built rather than a
        # platform not worth running: no PyPy wheel on Windows on either
        # architecture, and no CPython before 3.11 on windows arm64
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    needs: build-cibuildwheel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # see suite-dynamic
      - name: Set up every interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHONS }}

      # only the wheels built for this platform, as above
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-wheels-${{ matrix.os }}
          path: dist

      # the loop, the folds and the failures named together: see
      # suite-dynamic. The install is the point of this job rather than a
      # step before it -- pip choosing among a directory of wheels tagged
      # for seven interpreters -- so it stays inside the loop with the run
      - name: Install the wheel and run the suite under each interpreter
        run: |
          failed=""
          for version in $PYTHONS; do
            case $version in
              pypy-*) python=pypy${version#pypy-} ;;
              *) python=python$version ;;
            esac
            echo "::group::$version ($python)"
            if "$python" --version \
              && "$python" -m pip install -U pip pytest cffi \
              && "$python" -m pip install --verbose --no-index \
                --find-links dist/ btclib_secp256k1 \
              && "$python" -m pytest; then
              echo "$version passed"
            else
              failed="$failed $version"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::the suite failed under:$failed"
            exit 1
          fi

  # one context for the branch rule, instead of the matrix's own. A rule
  # naming `Run the suite on the static wheel, 3.10, ubuntu-latest` names a
  # context that stops being produced the moment the matrix changes, and a
  # required check that produces no run blocks every merge with nothing in
  # the tree to explain why -- the rule living outside the repository. So
  # the rule names this job, and a job added to this workflow belongs in
  # the `needs` below or it gates nothing. REPOSITORY.md carries the branch
  # rule itself.
  #
  # The name carries the workflow because a context is keyed by name alone:
  # two workflows with a job named the same thing produce one ambiguous
  # check, and macos.yml and windows.yml are two more workflows over the
  # same matrix shape.
  #
  # `if: !cancelled()` because a job with unmet `needs` is skipped, and a
  # skipped check is not a failed one: without it a failing matrix cell
  # would leave this context reported as skipped, which satisfies a
  # required check rather than blocking on it. A cancellation of this
  # run itself, though, is no evidence either way -- the concurrency
  # group superseding it with a newer push -- and `always()` used to
  # carry that into an explicit failure below despite the run's own
  # cancellation already speaking for it. `!cancelled()` skips this job
  # in that case instead, which satisfies the check the way any other
  # skip does, while a job cancelled on its own rather than by the run's
  # own cancellation still fails below
  test-passed:
    name: "test: every job passed"
    # and the draft condition every job above carries, so a draft
    # skips uniformly rather than tripping the skip check below -- the
    # closed one for the same reason, added at the trigger above
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.action != 'closed' }}
    needs:
      - changes
      - coverage
      - build-cibuildwheel
      - build-dynamic
      - build-sdist
      - suite-sdist
      - build-windows
      - check-dist
      - suite-dynamic
      - suite-static
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail unless every job above succeeded
        # the results are read rather than the run's conclusion, which is
        # not available to a job of the run it would describe
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
