---
name: docs

# the third gate, and a question of its own: does the documentation build.
# Nothing else in CI builds it, only read the docs does, on a service whose
# failure is not a check on a pull request -- so invalid reStructuredText in
# a docstring, or a module sphinx cannot import because the extension did not
# compile, would surface after the merge and somewhere else.
#
# No hook can take this over: markdownlint does not read .rst, and ruff's
# pydocstyle rules check the form of a docstring rather than whether its body
# is valid rst.
#
# A workflow of its own rather than a job in lint.yml, where it started: a
# failed docs build and a failed hook are two different verdicts about two
# different things, and one badge and one line in the checks list each is
# what says so. It also installs a different dependency group and needs the
# submodule and no pre-commit cache, so the two share nothing but a checkout

on:
  push:
    # main only, for the reason lint.yml gives at the same key: a push to a
    # branch with an open pull request would run this twice, in two
    # concurrency groups that do not cancel each other for every
    # pull_request action except closed on a merge -- see that trigger's
    # own comment below -- and the pull_request run is the one worth
    # keeping
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default types
    # do not include it, and without it a readied pull request would wait
    # for its next push to be checked at all.
    # closed joins them for a different reason: merging or closing a pull
    # request is neither a push nor a synchronize, so a run still held in
    # this pull request's own concurrency group survives it --
    # cancel-in-progress only fires when a new run lands in that group,
    # and nothing otherwise does. Landing the closed event there is what
    # lets it supersede the stale run instead of leaving it to finish on
    # a branch nobody is going to look at again; the job below declines
    # the real work on it, the merge commit being main's own push
    # trigger's question. "This pull request's own group" is the part
    # github.ref alone got wrong: for a closed, merged pull request it
    # resolves to the base branch's ref, the same one the push trigger's
    # own run computes, so the closed run landed in *that* group instead
    # and would cancel the run building the actual merge commit's
    # documentation -- observed doing exactly that to bitcoin-core-rpc's
    # own main, after its #136 merged there. The concurrency block below
    # groups by the pull request's own number instead, immune to that
    # collision under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows the release workflow to reuse this gate
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must not
# be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR, named literally and
# discriminated by an input rather than left to github.ref alone, for the
# three reasons lint.yml gives at length: release.yml calls this workflow
# beside lint.yml, test.yml, macos.yml, windows.yml and published.yml, and
# a group computed from github.workflow would have every one of them
# cancel the others, that expression being the caller's name in each
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  docs:
    # the name is a required check, and it did not change when this job left
    # lint.yml: branch protection matches a context by name and not by the
    # workflow that reported it, which is what let the move happen without
    # touching the rule
    name: Build the documentation
    # a draft pull request is work in progress and spends no runner here
    # either. Neither does a closed one -- the trigger above takes the
    # closed event only to let cancel-in-progress supersede a run still
    # holding in this ref's group
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # every automodule directive imports this package, which compiles
          # the vendored libsecp256k1 to do that -- unlike btclib's own
          # docs job, which builds nothing
          submodules: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # the same command .readthedocs.yaml runs and docs/README.rst
      # documents, so what CI checks is what gets published. -W turns a
      # module sphinx cannot import into a failed build rather than a bare
      # heading; --keep-going reports every problem in one run
      - name: Build the docs
        run: >
          uv run --locked --no-default-groups --group docs
          sphinx-build -W --keep-going -b html docs/source docs/build/html

      # the one defect the build above cannot report on itself, matching
      # btclib's own second step and the reasoning in its docs/source/conf.py:
      # a link myst cannot resolve becomes an anchor on the page it is
      # already on -- an id nothing has -- rather than a warning, which
      # conf.py's RootFileLinks transform exists to prevent. This is the
      # same claim made about the artifact rather than about the
      # configuration, and what would catch a suppression added back.
      #
      # One grep, because there is one spelling to look for. myst's
      # fallback renders the destination verbatim, so what this can match
      # is decided upstream of here, in how the link was written -- and
      # the local-link-prefix hook in .pre-commit-config.yaml refuses a
      # local destination that does not begin "./", in the commit that
      # writes it. Every destination the included root files carry
      # therefore renders "#./<destination>" when it breaks, anchor,
      # extension and nested path alike, which this pattern catches
      # whole (issue btclib-org/.github#20; the hook's own comment has
      # the measurement).
      #
      # Not a second grep for a bare destination beside it. It would be
      # unreachable with the hook in place, and it is no superset of this
      # one even without: a character class of name characters stops at
      # the "#" of an anchor, so "#README.md#build" is a shape both
      # patterns pass over. That is the whole argument for the hook. A
      # check downstream of the rendering has to anticipate every way a
      # link can be written; a rule upstream of it permits one.
      - name: Check the built pages for unresolved links
        run: |
          if grep -rn 'href="#\./' docs/build/html --include='*.html'; then
            echo "::error::the links above resolve to no page (unresolved relative path)"
            exit 1
          fi
