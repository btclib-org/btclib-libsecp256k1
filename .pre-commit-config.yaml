# Skip execution of one or more hooks using the SKIP environment variable:
# $ SKIP=mypy git commit -m "foo"
# $ SKIP=mypy,ruff-check pre-commit run --all-files
#
# If want to disable all hooks while committing, use the --no-verify/-n option:
# $ git commit -n -m "foo"

# pre-commit.ci is enabled on this repository, and since the main
# workflow grew a lint job the hooks are checked in two places. The gate
# is the lint job, in the same run as the build and test matrices; what
# pre-commit.ci alone provides, and what it is kept for, is the periodic
# pull request bumping the revisions pinned below.
ci:
  # a bot committing to a branch is at odds with the rest of this setup,
  # where the workflow token cannot write and every action is pinned to
  # a commit SHA: a failing hook has to be fixed by its author
  autofix_prs: false
  # onto dev, as Dependabot does: master only receives merges from it
  autoupdate_branch: dev
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # not the default --fix=auto, which normalizes a file to its own
        # most frequent ending: a file entirely in CRLF is consistent by
        # that measure, so it stays, and the LF lines added to it are
        # converted the wrong way. This repository is LF throughout
        args: [--fix=lf]
        # except for the BIP340 vectors, vendored from bitcoin/bips byte
        # for byte, CRLF included: what makes them worth trusting is
        # being the upstream file, which anyone can fetch and diff, and
        # the csv module reads them either way
        exclude: ^tests/bip340_test_vectors\.csv$
      - id: check-case-conflict
      # - id: check-executables-have-shebangs
      # - id: check-shebang-scripts-are-executable
      # - id: fix-byte-order-marker
      # - id: fix-encoding-pragma
      - id: check-yaml
      # - id: pretty-format-json
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: debug-statements
      - id: check-docstring-first
      # - id: name-tests-test
      - id: check-toml
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  - repo: https://github.com/leoll2/copyright_notice_precommit
    rev: 0.1.1
    hooks:
      - id: copyright-notice
        args: [--notice=COPYRIGHT]
        # "python" as a filename pattern never matched anything: the
        # notice was checked on no file at all
        files: \.py$
  # ruff replaces black, isort, flake8, autoflake, pyupgrade, bandit,
  # pydocstringformatter and yesqa: one tool, one config section in
  # pyproject.toml, and a fraction of the runtime. The rule selection
  # (and what each family stands in for) is documented there
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: ruff (lint, in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff (format, in place fixes)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # the mirror injects --ignore-missing-imports by default, which
        # silently turns an unresolved (or misspelled) import into Any:
        # that is the opposite of strict. The modules that legitimately
        # cannot be resolved are declared in the pyproject overrides
        args: [--scripts-are-modules]
        # in strict mode an unresolved import is an error, and mypy runs
        # in its own isolated environment: what the checked files import
        # has to be declared here
        additional_dependencies:
          - cffi
          - types-cffi
          - hatchling
          - pytest
